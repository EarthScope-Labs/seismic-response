# Pushing a tag `vX.Y.Z` checks it against the package version, CITATION.cff and CHANGELOG.md, runs the
# tests, and creates a draft GitHub release with the CHANGELOG notes. A draft is not archived by Zenodo and
# does not deploy the site or upload to PyPI; publishing it by hand does all three.
name: draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check version and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install cffconvert
      - run: cffconvert --validate
      - run: python tools/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"

  tests:
    name: Build and test
    needs: check
    uses: ./.github/workflows/tests.yml

  draft:
    name: Create draft release
    needs: [check, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          flags=""
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $flags \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
