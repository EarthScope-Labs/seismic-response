name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check src tests tools

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/seismic-response info tests/data/real/RESP.IU.ANMO.00.BHZ
          mkdir /tmp/run && cd /tmp/run
          /tmp/clean/bin/pyevalresp ANMO BHZ 2000 100 0.01 10 3 -f "$GITHUB_WORKSPACE/tests/data/real/RESP.IU.ANMO.00.BHZ" -r fap
          test "$(head -1 FAP.IU.ANMO.00.BHZ)" = "1.000000E-02 6.504193E+08 5.353581E+01"

  pyodide:
    name: Pyodide (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install .
      - run: python -m seismic_response.gui --build web-dist
      - name: Run the package under Pyodide and compare with C evalresp
        working-directory: tests/pyodide
        run: |
          npm install
          node smoke.mjs ../../web-dist ../data/real
